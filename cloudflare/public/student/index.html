<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>学生上课记录</title>
<style>
/* student glassmorphism 2026 */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(900px 500px at 10% -10%, rgba(255,170,170,0.4), transparent 60%),
                radial-gradient(700px 400px at 100% 0%, rgba(180,220,255,0.35), transparent 60%),
                linear-gradient(160deg, #3a1d5b 0%, #0d4a7a 100%);
    min-height: 100vh; padding: 18px; color: #112;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  /* 玻璃拟态 Hero */
  .hero {
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.28);
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 22px;
    padding: 22px; margin-bottom: 16px;
    box-shadow: 0 12px 36px rgba(10,10,50,0.3);
    color: #fff;
  }
  .hero .name { font-size: 22px; font-weight: 700; text-shadow: 1px 1px 0 rgba(0,0,0,0.15); }
  .hero .meta { font-size: 13px; opacity: .95; margin-top: 6px; }
  .hero .total { display: flex; gap: 22px; margin-top: 16px; font-size: 12px; opacity: .95; }
  .hero .total b { font-size: 20px; display: block; margin-bottom: 2px; font-weight: 700; }

  /* 玻璃拟态 Card */
  .card {
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 18px; padding: 18px;
    box-shadow: 0 8px 26px rgba(10,10,50,0.22);
    margin-bottom: 14px; color: #fff;
  }
  .card h3 {
    font-size: 15px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
    color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
  }
  .card h3 .dot { width: 7px; height: 7px; border-radius: 50%; background: #4facfe; box-shadow: 0 0 6px rgba(79,172,254,0.6); }

  /* 课程卡片：实体白色保证可读 */
  .course {
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 14px; padding: 14px; margin-bottom: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    color: #112;
  }
  .course:last-child { margin-bottom: 0; }
  .course .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .course .cname { font-size: 15px; font-weight: 600; color: #112; }
  .course .teacher { font-size: 12px; color: #666; margin-top: 4px; }
  .course .remain { font-size: 14px; color: #4facfe; font-weight: 700; white-space: nowrap; }
  .course .remain.zero { color: #eb3349; }

  /* 进度条 */
  .bar { height: 10px; background: #eef1f7; border-radius: 6px; margin-top: 12px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: linear-gradient(90deg, #4facfe, #7b8cff); border-radius: 6px; transition: width .4s ease; }
  .nums { display: flex; justify-content: space-between; font-size: 12px; color: #789; margin-top: 6px; }

  /* 记录列表：玻璃分隔线 */
  .rec {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.25);
    font-size: 14px; color: #fff;
  }
  .rec:last-child { border-bottom: none; }
  .rec .when { min-width: 100px; color: rgba(255,255,255,0.8); }
  .rec .what { flex: 1; min-width: 0; }
  .rec .what .cn { color: #fff; }
  .rec .what .t { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }

  .tag { font-size: 12px; padding: 4px 10px; border-radius: 10px; white-space: nowrap; font-weight: 600; }
  .tag-ok     { background: rgba(212,237,218,0.9); color: #155724; }
  .tag-leave  { background: rgba(248,215,218,0.9); color: #721c24; }

  .empty { text-align: center; color: rgba(255,255,255,0.6); font-size: 14px; padding: 30px 0; }
  .foot { text-align: center; color: rgba(255,255,255,0.5); font-size: 12px; margin: 18px 0 8px; }
  .err {
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    padding: 48px 24px; text-align: center; color: #fff;
    font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="err">加载中...</div>
</div>

<script>
const API = '/api';
const token = new URLSearchParams(location.search).get('token') || '';

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function load() {
  const app = document.getElementById('app');
  if (!token) {
    app.innerHTML = '<div class="err">分享链接不完整，请联系老师获取正确链接</div>';
    return;
  }
  try {
    const r = await fetch(API + '/public/student?token=' + encodeURIComponent(token));
    const d = await r.json();
    if (d.code !== 200) {
      app.innerHTML = '<div class="err">' + esc(d.msg || '分享链接无效或已失效') + '</div>';
      return;
    }
    render(d.data);
  } catch (e) {
    app.innerHTML = '<div class="err">网络异常，请稍后重试</div>';
  }
}

function render(data) {
  const s = data.student;
  const courses = data.courses || [];
  const records = data.records || [];
  const sm = data.summary || {};
  const totalAll = Number(sm.totalLessons != null ? sm.totalLessons : courses.reduce((n, c) => n + Number(c.totalLessons || 0), 0));
  const usedAll = Number(sm.attendedLessons != null ? sm.attendedLessons : courses.reduce((n, c) => n + Number(c.usedLessons || 0), 0));
  const remainAll = Number(sm.remainingLessons != null ? sm.remainingLessons : courses.reduce((n, c) => n + Number(c.remainingLessons || 0), 0));

  const courseHtml = courses.length ? courses.map(c => {
    const pct = c.totalLessons > 0 ? Math.min(100, Math.round(c.usedLessons / c.totalLessons * 100)) : 0;
    const hasTotal = c.totalLessons > 0;
    return '<div class="course">' +
      '<div class="top"><div><div class="cname">' + esc(c.courseName) + '</div>' +
      '<div class="teacher">老师：' + esc(c.teacherName || '未指定') + '</div></div>' +
      '<div class="remain ' + (hasTotal && c.remainingLessons <= 0 ? 'zero' : '') + '">' + (hasTotal ? '剩 ' + c.remainingLessons + ' 节' : '总课次未设置') + '</div></div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '<div class="nums"><span>已上 ' + c.usedLessons + ' 节</span><span>共 ' + (hasTotal ? c.totalLessons + ' 节' : '—') + '</span></div>' +
      '</div>';
  }).join('') : '<div class="empty">老师还没有为你添加套课</div>';

  const recordHtml = records.length ? records.map(r => {
    const tag = r.present ? '<span class="tag tag-ok">已上课</span>' : '<span class="tag tag-leave">请假</span>';
    return '<div class="rec"><div class="when">' + esc(r.date) + '<br><span style="font-size:11px;color:#9aa0aa;">' + esc(r.time) + '</span></div>' +
      '<div class="what"><div class="cn">' + esc(r.courseName || r.className) + '</div>' +
      '<div class="t">' + esc(r.teacherName || '') + (r.lessonLabel ? ' · ' + esc(r.lessonLabel) : '') + '</div></div>' +
      tag + '</div>';
  }).join('') : '<div class="empty">还没有上课记录，老师打卡后会显示在这里</div>';

  document.getElementById('app').innerHTML =
    '<div class="hero"><div class="name">' + esc(s.name) + '</div>' +
    '<div class="meta">' + esc(s.gradeName || '未设置年级') + '</div>' +
    '<div class="total"><div><b>' + usedAll + '</b>已上课次</div><div><b>' + remainAll + '</b>剩余课次</div><div><b>' + totalAll + '</b>总课次</div></div></div>' +
    '<div class="card"><h3><span class="dot"></span>我的套课</h3>' + courseHtml + '</div>' +
    '<div class="card"><h3><span class="dot"></span>最近上课记录</h3>' + recordHtml + '</div>' +
    '<div class="foot">数据来自老师打卡记录 · 请假不扣课时</div>';
}

load();
</script>
</body>
</html>
