# 一键 Docker Compose 启动
# 访问：http://localhost  → 管理后台网页
#      http://localhost:8080/api → 后端 API（Swagger 待接入）
#      MySQL: localhost:3306, user=root, password=root, db=school_salary

services:
  mysql:
    image: mysql:8.0
    container_name: salary-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school_salary
    ports:
      - "3306:3306"
    volumes:
      - ./sql/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./sql/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - salary-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salary-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/school_salary?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: school-salary-admin-system-internal-use-only-2026
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - salary-net

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: salary-admin-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - salary-net

  teacher-web:
    build:
      context: ./teacher-app
      dockerfile: Dockerfile
    container_name: salary-teacher-web
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - salary-net

  admin-app-web:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
    container_name: salary-admin-app-web
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - salary-net

volumes:
  mysql_data:

networks:
  salary-net:
    driver: bridge
