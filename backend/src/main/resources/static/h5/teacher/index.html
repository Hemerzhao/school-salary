<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>教师打卡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; padding: 20px; }
  .wrap { max-width: 420px; margin: 0 auto; }

  /* 登录页 */
  .login-card { background: #fff; border-radius: 20px; padding: 32px 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.15); margin-top: 40px; }
  .login-card h1 { text-align: center; color: #333; font-size: 22px; margin-bottom: 6px; }
  .login-card p { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
  .logo { text-align: center; font-size: 48px; margin-bottom: 12px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; color: #555; font-size: 13px; margin-bottom: 6px; }
  .field input { width: 100%; height: 48px; border: 1.5px solid #e0e0e0; border-radius: 12px; padding: 0 14px; font-size: 15px; outline: none; transition: border-color .2s; }
  .field input:focus { border-color: #4facfe; }
  .btn { width: 100%; height: 50px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform .1s; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: linear-gradient(135deg, #4facfe, #00c6fb); color: #fff; }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

  /* 打卡页 */
  .header { display: flex; justify-content: space-between; align-items: center; color: #fff; margin-bottom: 24px; }
  .header h2 { font-size: 18px; font-weight: 600; }
  .header button { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; }
  .card { background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.15); margin-bottom: 16px; }
  .card h3 { font-size: 16px; color: #333; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .card h3 .dot { width: 8px; height: 8px; background: #4facfe; border-radius: 50%; }

  .timer { text-align: center; padding: 20px; }
  .timer .time { font-size: 56px; font-weight: 200; color: #4facfe; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
  .timer .label { color: #888; font-size: 13px; margin-top: 4px; }

  .big-btn { width: 100%; height: 56px; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .big-btn:active { transform: scale(0.98); }
  .btn-start { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #fff; }
  .btn-end { background: linear-gradient(135deg, #fa709a, #fee140); color: #fff; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-row { margin-bottom: 16px; }
  .field-row label { display: block; color: #555; font-size: 13px; margin-bottom: 6px; }
  .field-row input, .field-row textarea, .field-row select { width: 100%; height: 46px; border: 1.5px solid #e0e0e0; border-radius: 10px; padding: 0 14px; font-size: 15px; outline: none; background: #fff; font-family: inherit; }
  .field-row textarea { height: auto; padding: 12px 14px; min-height: 80px; resize: vertical; }
  .field-row input:focus, .field-row textarea:focus, .field-row select:focus { border-color: #4facfe; }

  .student-tag { display: inline-flex; align-items: center; gap: 4px; background: #e8f4fd; color: #4facfe; padding: 4px 10px; border-radius: 14px; font-size: 12px; margin: 3px; }
  .student-tag button { background: none; border: none; color: #999; cursor: pointer; font-size: 14px; padding: 0 2px; }

  .toast { position: fixed; top: 30%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 10px; z-index: 999; font-size: 14px; display: none; }
  .toast.show { display: block; animation: fadeIn .2s; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 998; }
  .modal.show { display: flex; }
  .modal-box { background: #fff; border-radius: 14px; padding: 24px; width: 300px; }
  .modal-box h3 { margin-bottom: 16px; font-size: 16px; }
  .modal-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; font-size: 14px; box-sizing: border-box; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 14px; }
  .modal-actions .btn-ok { background: #4a6cf7; border-color: #4a6cf7; color: #fff; }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .status-wait { background: #fff3cd; color: #856404; }
  .status-ok { background: #d4edda; color: #155724; }
  .status-rej { background: #f8d7da; color: #721c24; }

  .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .history-item:last-child { border-bottom: none; }
  .history-item .info { flex: 1; }
  .history-item .info .title { font-size: 14px; color: #333; font-weight: 500; }
  .history-item .info .sub { font-size: 12px; color: #999; margin-top: 2px; }
  .empty { text-align: center; color: #bbb; padding: 30px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录页 -->
  <div id="loginPage" style="display:none;">
    <div class="login-card">
      <div class="logo">📚</div>
      <h1>教师打卡</h1>
      <p>请输入账号密码登录</p>
      <div class="field">
        <label>账号</label>
        <input id="username" placeholder="教师账号" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="loginBtn">登 录</button>
    </div>
  </div>

  <!-- 主页（打卡） -->
  <div id="mainPage" style="display:none;">
    <div class="header">
      <h2>👋 <span id="teacherName"></span></h2>
      <div style="display:flex;gap:8px;">
        <button onclick="openPwdModal()">密码</button>
        <button onclick="logout()">退出</button>
      </div>
    </div>

    <!-- 打卡表单 -->
    <div class="card" id="infoCard">
      <h3><span class="dot"></span>填写上课信息</h3>
      <div class="field-row">
        <label>上课时长（小时，支持 1.5）</label>
        <input id="durationHours" type="number" min="0.5" step="0.5" placeholder="如 2">
      </div>
      <div class="grid2">
        <div class="field-row">
          <label>到课人数</label>
          <input id="studentCount" type="number" min="0" placeholder="如 18">
        </div>
        <div class="field-row">
          <label>请假人数</label>
          <input id="leaveCount" type="number" min="0" value="0">
        </div>
      </div>
      <div class="field-row">
        <label>学生姓名（逗号分隔）</label>
        <textarea id="studentNames" placeholder="张三, 李四, 王五 ..."></textarea>
        <div id="tagArea" style="margin-top:8px;"></div>
      </div>
      <button class="btn btn-primary" style="margin-top:12px;height:48px;" onclick="submitAttendance()">提交打卡</button>
    </div>

    <!-- 历史记录 -->
    <div class="card" id="historyCard">
      <h3><span class="dot"></span>最近打卡记录</h3>
      <div id="historyList"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<!-- 修改密码弹窗 -->
<div class="modal" id="pwdModal">
  <div class="modal-box">
    <h3>修改密码</h3>
    <input id="oldPwd" type="password" placeholder="原密码" autocomplete="off">
    <input id="newPwd" type="password" placeholder="新密码（至少 6 位）" autocomplete="off">
    <input id="newPwd2" type="password" placeholder="确认新密码" autocomplete="off">
    <div class="modal-actions">
      <button onclick="closePwdModal()">取消</button>
      <button class="btn-ok" onclick="submitChangePwd()">确定</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('teacher_token');
let teacher = null;

// ---------- 初始化 ----------
window.onload = () => {
  if (token && localStorage.getItem('teacherInfo')) {
    teacher = JSON.parse(localStorage.getItem('teacherInfo'));
    showMain();
  } else {
    showLogin();
  }
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('studentNames').addEventListener('blur', renderTags);
};

function showLogin() { document.getElementById('loginPage').style.display = 'block'; document.getElementById('mainPage').style.display = 'none'; }
function showMain() { document.getElementById('loginPage').style.display = 'none'; document.getElementById('mainPage').style.display = 'block'; document.getElementById('teacherName').textContent = teacher.name; loadHistory(); }

// ---------- 登录 ----------
async function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u || !p) return toast('请输入账号密码');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const r = await fetch(API + '/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
    const d = await r.json();
    if (d.code === 200) {
      token = d.data.token;
      teacher = d.data.user;
      localStorage.setItem('teacher_token', token);
      localStorage.setItem('teacherInfo', JSON.stringify(teacher));
      showMain();
    } else {
      toast(d.msg || '登录失败');
    }
  } catch(e) { toast('网络错误'); }
  btn.disabled = false; btn.textContent = '登 录';
}

function logout() { localStorage.removeItem('teacher_token'); localStorage.removeItem('teacherInfo'); token=null; teacher=null; showLogin(); }

// ---------- 修改密码 ----------
function openPwdModal() {
  document.getElementById('oldPwd').value = '';
  document.getElementById('newPwd').value = '';
  document.getElementById('newPwd2').value = '';
  document.getElementById('pwdModal').classList.add('show');
}

function closePwdModal() {
  document.getElementById('pwdModal').classList.remove('show');
}

async function submitChangePwd() {
  const oldPassword = document.getElementById('oldPwd').value;
  const newPassword = document.getElementById('newPwd').value;
  const newPassword2 = document.getElementById('newPwd2').value;

  if (!oldPassword) return toast('请输入原密码');
  if (!newPassword || newPassword.length < 6) return toast('新密码至少 6 位');
  if (newPassword !== newPassword2) return toast('两次输入的新密码不一致');

  try {
    const r = await fetch(API + '/auth/change-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify({ oldPassword, newPassword })
    });
    const d = await r.json();
    if (d.code === 200) {
      closePwdModal();
      toast('密码修改成功，请重新登录');
      setTimeout(() => logout(), 1500);
    } else {
      toast(d.msg || '修改失败');
    }
  } catch(e) { toast('网络错误'); }
}

function renderTags() {
  const text = document.getElementById('studentNames').value.trim();
  const names = text.split(/[,，、\s]+/).filter(Boolean);
  const area = document.getElementById('tagArea');
  area.innerHTML = names.map((n,i) => `<span class="student-tag">${n} <button onclick="removeStudent(${i})">×</button></span>`).join('');
}
function removeStudent(i) {
  const names = document.getElementById('studentNames').value.split(/[,，、\s]+/).filter(Boolean);
  names.splice(i,1);
  document.getElementById('studentNames').value = names.join(', ');
  renderTags();
}

// ---------- 提交打卡 ----------
async function submitAttendance() {
  const hours = parseFloat(document.getElementById('durationHours').value);
  const studentCount = parseInt(document.getElementById('studentCount').value) || 0;
  const leaveCount = parseInt(document.getElementById('leaveCount').value) || 0;

  if (!hours || hours <= 0) return toast('请填写上课时长');
  if (studentCount <= 0) return toast('请填写到课人数');

  const data = {
    durationMinutes: Math.round(hours * 60),
    studentCount,
    leaveCount,
    studentNames: document.getElementById('studentNames').value
  };
  try {
    const r = await fetch(API + '/attendance/simple', {
      method: 'POST', headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify(data)
    });
    const d = await r.json();
    if (d.code === 200) {
      toast('打卡提交成功 ✓');
      document.getElementById('durationHours').value = '';
      document.getElementById('studentCount').value = '';
      document.getElementById('leaveCount').value = '0';
      document.getElementById('studentNames').value = '';
      document.getElementById('tagArea').innerHTML = '';
      loadHistory();
    } else {
      toast(d.msg || '提交失败');
    }
  } catch(e) { toast('网络错误'); }
}

// ---------- 历史 ----------
async function loadHistory() {
  try {
    const r = await fetch(API + '/attendance/my', { headers: {'Authorization':'Bearer '+token} });
    const d = await r.json();
    const recs = (Array.isArray(d.data) ? d.data : []).slice(0, 5);
    if (recs.length) {
      document.getElementById('historyList').innerHTML = recs.map(a => `
        <div class="history-item">
          <div class="info">
            <div class="title">${(a.durationMinutes/60).toFixed(1)} 小时 · 到课 ${a.studentCount} 人${a.leaveCount?' · 请假 '+a.leaveCount+' 人':''}</div>
            <div class="sub">${(a.actualStartTime||'').slice(0,16)}</div>
          </div>
          <span class="status-badge ${a.auditStatus===1?'status-ok':a.auditStatus===2?'status-rej':'status-wait'}">
            ${a.auditStatus===1?'已通过':a.auditStatus===2?'已驳回':'待审核'}
          </span>
        </div>
      `).join('');
    } else {
      document.getElementById('historyList').innerHTML = '<div class="empty">还没有打卡记录</div>';
    }
  } catch(e) { document.getElementById('historyList').innerHTML = '<div class="empty">加载失败</div>'; }
}

// ---------- Toast ----------
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
