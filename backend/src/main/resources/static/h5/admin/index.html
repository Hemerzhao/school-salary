<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工资管理后台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f7fa; min-height: 100vh; }

  /* 登录 */
  .login-wrap { display: flex; justify-content: center; align-items: center; min-height: 100vh;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  .login-card { background: #fff; border-radius: 16px; padding: 40px 36px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .login-card h1 { text-align: center; color: #333; margin-bottom: 4px; font-size: 22px; }
  .login-card p { text-align: center; color: #999; font-size: 13px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; color: #666; font-size: 13px; margin-bottom: 6px; }
  .field input { width: 100%; height: 44px; border: 1px solid #e0e0e0; border-radius: 8px; padding: 0 14px; font-size: 14px; outline: none; }
  .field input:focus { border-color: #667eea; }
  .btn { width: 100%; height: 44px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }

  /* 主框架 */
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: #1a1a2e; color: #fff; flex-shrink: 0; }
  .sidebar .logo { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 16px; font-weight: 600; }
  .sidebar .logo span { font-size: 12px; color: #888; font-weight: 400; display: block; margin-top: 2px; }
  .nav { padding: 12px 0; }
  .nav-item { padding: 12px 20px; cursor: pointer; color: #ccc; font-size: 14px; border-left: 3px solid transparent; transition: all .15s; }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .nav-item.active { background: rgba(102,126,234,0.2); color: #fff; border-left-color: #667eea; }
  .sidebar .user { position: absolute; bottom: 20px; left: 0; right: 0; padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
  .sidebar .user .name { color: #fff; font-size: 13px; }
  .sidebar .user button { background: none; border: 1px solid #444; color: #888; padding: 4px 10px; border-radius: 4px; font-size: 11px; margin-top: 8px; cursor: pointer; }

  .main { flex: 1; padding: 24px 32px; }
  .page-title { font-size: 20px; color: #333; margin-bottom: 20px; }

  .card { background: #fff; border-radius: 10px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .card h3 { font-size: 16px; color: #333; margin-bottom: 16px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field label { display: block; color: #666; font-size: 13px; margin-bottom: 6px; }
  .field input { width: 100%; height: 40px; border: 1px solid #e0e0e0; border-radius: 6px; padding: 0 12px; font-size: 14px; outline: none; }
  .field input:focus { border-color: #667eea; }
  .form-row { display: flex; gap: 12px; align-items: flex-end; }
  .form-row .field { flex: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table th { background: #f8f9fa; padding: 10px 14px; text-align: left; color: #666; font-weight: 500; border-bottom: 1px solid #eee; }
  table td { padding: 10px 14px; border-bottom: 1px solid #f5f5f5; color: #333; }
  table tr:hover td { background: #fafbff; }

  .btn-sm { padding: 4px 12px; border-radius: 6px; border: none; font-size: 12px; cursor: pointer; }
  .btn-green { background: #43e97b; color: #fff; }
  .btn-red { background: #fa709a; color: #fff; }
  .btn-blue { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 8px 20px; }
  .btn-blue:disabled { background: #ccc; cursor: not-allowed; }

  .tag { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .tag-wait { background: #fff3cd; color: #856404; }
  .tag-ok { background: #d4edda; color: #155724; }
  .tag-rej { background: #f8d7da; color: #721c24; }

  .stat-box { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-radius: 10px; padding: 20px; text-align: center; }
  .stat-box .num { font-size: 32px; font-weight: 600; }
  .stat-box .lbl { font-size: 12px; opacity: 0.85; margin-top: 4px; }

  .pay-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
  .pay-row:last-child { border-bottom: none; }
  .pay-row .name { font-weight: 500; color: #333; }
  .pay-row .amount { color: #667eea; font-weight: 600; }

  .toast { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 8px; z-index: 999; font-size: 13px; display: none; }
  .toast.show { display: block; animation: fadeIn .2s; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 998; }
  .modal.show { display: flex; }
  .modal-box { background: #fff; border-radius: 12px; padding: 24px; width: 320px; }
  .modal-box h3 { margin-bottom: 16px; font-size: 16px; }
  .modal-box input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; font-size: 14px; box-sizing: border-box; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 14px; }
  .modal-actions .btn-primary { background: #4a6cf7; border-color: #4a6cf7; color: #fff; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .empty { text-align: center; color: #bbb; padding: 40px; font-size: 13px; }

  .pay-rule { background: #f8f9fa; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .pay-rule .rule-title { font-weight: 600; color: #333; margin-bottom: 10px; font-size: 14px; }
  .pay-rule .formula { background: #fff; border: 1px dashed #ddd; border-radius: 6px; padding: 10px; font-family: Menlo, monospace; font-size: 12px; color: #667eea; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-wrap" style="display:none;">
  <div class="login-card">
    <h1>💼 工资管理后台</h1>
    <p>管理员登录</p>
    <div class="field"><label>账号</label><input id="username" placeholder="管理员账号"></div>
    <div class="field"><label>密码</label><input id="password" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="mainPage" class="layout" style="display:none;">
  <div class="sidebar" style="position:relative;">
    <div class="logo">💼 工资管理<span>教师工资统计系统</span></div>
    <div class="nav">
      <div class="nav-item active" data-tab="attendance" onclick="switchTab('attendance')">📋 打卡数据</div>
      <div class="nav-item" data-tab="teachers" onclick="switchTab('teachers')">👥 教师管理</div>
      <div class="nav-item" data-tab="salary" onclick="switchTab('salary')">💰 工资计算</div>
    </div>
    <div class="user">
      <div class="name" id="adminName"></div>
      <button onclick="openPwdModal()">修改密码</button>
      <button onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="main">

    <!-- 打卡数据 -->
    <div id="tab-attendance">
      <h2 class="page-title">📋 打卡数据确认</h2>
      <div class="card">
        <h3>待审核打卡</h3>
        <table>
          <thead><tr>
            <th>教师</th><th>上课时间</th><th>时长</th><th>到课</th><th>请假</th><th>学生名单</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody id="attendanceTable"></tbody>
        </table>
        <div class="empty" id="attendanceEmpty" style="display:none;">暂无打卡记录</div>
      </div>
    </div>

    <!-- 教师管理 -->
    <div id="tab-teachers" style="display:none;">
      <h2 class="page-title">👥 教师账号注册</h2>
      <div class="card">
        <h3>注册新教师</h3>
        <div class="grid2">
          <div class="field"><label>姓名</label><input id="t_name" placeholder="如：张三"></div>
          <div class="field"><label>账号</label><input id="t_account" placeholder="如：teacher4"></div>
          <div class="field"><label>初始密码</label><input id="t_password" type="text" value="admin123"></div>
          <div class="field"><label>教师等级</label>
            <select id="t_level" style="width:100%;height:40px;border:1px solid #e0e0e0;border-radius:6px;padding:0 12px;font-size:14px;outline:none;">
              <option value="P1">P1 初级</option>
              <option value="P2" selected>P2 中级</option>
              <option value="P3">P3 高级</option>
            </select>
          </div>
        </div>
        <button class="btn btn-blue" style="margin-top:16px;" onclick="registerTeacher()">✓ 注册教师账号</button>
      </div>
      <div class="card">
        <h3>已注册教师列表</h3>
        <table>
          <thead><tr><th>账号</th><th>姓名</th><th>等级</th><th>注册时间</th><th>状态</th></tr></thead>
          <tbody id="teacherTable"></tbody>
        </table>
        <div class="empty" id="teacherEmpty" style="display:none;">暂无教师</div>
      </div>
    </div>

    <!-- 工资计算 -->
    <div id="tab-salary" style="display:none;">
      <h2 class="page-title">💰 工资计算</h2>

      <div class="card">
        <h3>⚙️ 工资规则设置（手动修改）</h3>
        <div class="pay-rule">
          <div class="rule-title">公式：工资 = 基础课时费 + 人头增量</div>
          <div class="formula">总金额 = 基础课时费 × 课时数 + (到课人数 - 人头门槛) × 人头单价</div>
        </div>
        <div class="grid2">
          <div class="field"><label>基础课时费（元/小时）</label><input id="baseRate" type="number" step="0.01" placeholder="如：150"></div>
          <div class="field"><label>人头门槛（超过此人数才加钱）</label><input id="headThreshold" type="number" placeholder="如：15"></div>
          <div class="field"><label>人头单价（元/人）</label><input id="headPrice" type="number" step="0.01" placeholder="如：5"></div>
          <div class="field"><label>计算月份</label><input id="calcMonth" type="month"></div>
        </div>
        <div style="margin-top:12px;display:flex;gap:10px;">
          <button class="btn btn-blue" style="flex:1;" onclick="saveRule()">💾 保存规则</button>
          <button class="btn btn-blue" style="flex:1;background:linear-gradient(135deg,#43e97b,#38f9d7);" onclick="calcSalary()">📊 计算本月工资</button>
        </div>
      </div>

      <div class="grid2">
        <div class="stat-box"><div class="num" id="statTeachers">0</div><div class="lbl">教师人数</div></div>
        <div class="stat-box"><div class="num" id="statTotal">¥0</div><div class="lbl">本月应发工资</div></div>
      </div>

      <div class="card">
        <h3>本月工资明细</h3>
        <div id="salaryList"></div>
        <div class="empty" id="salaryEmpty" style="display:none;">点击"计算本月工资"生成明细</div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 修改密码弹窗 -->
<div class="modal" id="pwdModal">
  <div class="modal-box">
    <h3>修改密码</h3>
    <input id="oldPwd" type="password" placeholder="原密码" autocomplete="off">
    <input id="newPwd" type="password" placeholder="新密码（至少 6 位）" autocomplete="off">
    <input id="newPwd2" type="password" placeholder="确认新密码" autocomplete="off">
    <div class="modal-actions">
      <button onclick="closePwdModal()">取消</button>
      <button class="btn-primary" onclick="submitChangePwd()">确定修改</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('admin_token');

window.onload = () => {
  if (token && localStorage.getItem('adminInfo')) {
    document.getElementById('adminName').textContent = JSON.parse(localStorage.getItem('adminInfo')).name;
    showMain();
  } else {
    showLogin();
  }
  document.getElementById('calcMonth').value = new Date().toISOString().slice(0,7);
  // 加载保存的规则
  const saved = localStorage.getItem('payRule');
  if (saved) { const r = JSON.parse(saved); document.getElementById('baseRate').value = r.baseRate; document.getElementById('headThreshold').value = r.headThreshold; document.getElementById('headPrice').value = r.headPrice; }
};

function showLogin() { document.getElementById('loginPage').style.display = 'flex'; document.getElementById('mainPage').style.display = 'none'; }
function showMain() { document.getElementById('loginPage').style.display = 'none'; document.getElementById('mainPage').style.display = 'flex'; loadAttendance(); loadTeachers(); }

// ---------- 登录 ----------
async function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u || !p) return toast('请输入账号密码');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';
  try {
    const r = await fetch(API + '/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
    const d = await r.json();
    if (d.code === 200) {
      token = d.data.token;
      localStorage.setItem('admin_token', token);
      localStorage.setItem('adminInfo', JSON.stringify(d.data.user));
      document.getElementById('adminName').textContent = d.data.user.name;
      showMain();
    } else { toast(d.msg || '登录失败'); }
  } catch(e) { toast('网络错误'); }
  btn.disabled = false; btn.textContent = '登 录';
}
function logout() { localStorage.removeItem('admin_token'); token=null; showLogin(); }

// ---------- 修改密码 ----------
function openPwdModal() {
  document.getElementById('oldPwd').value = '';
  document.getElementById('newPwd').value = '';
  document.getElementById('newPwd2').value = '';
  document.getElementById('pwdModal').classList.add('show');
}

function closePwdModal() {
  document.getElementById('pwdModal').classList.remove('show');
}

async function submitChangePwd() {
  const oldPassword = document.getElementById('oldPwd').value;
  const newPassword = document.getElementById('newPwd').value;
  const newPassword2 = document.getElementById('newPwd2').value;

  if (!oldPassword) return toast('请输入原密码');
  if (!newPassword || newPassword.length < 6) return toast('新密码至少 6 位');
  if (newPassword !== newPassword2) return toast('两次输入的新密码不一致');

  try {
    const r = await fetch(API + '/auth/change-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify({ oldPassword, newPassword })
    });
    const d = await r.json();
    if (d.code === 200) {
      closePwdModal();
      toast('✓ 密码修改成功，请重新登录');
      setTimeout(() => logout(), 1500);
    } else {
      toast(d.msg || '修改失败');
    }
  } catch(e) { toast('网络错误'); }
}

// ---------- Tab 切换 ----------
function switchTab(name) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === name));
  ['attendance','teachers','salary'].forEach(t => document.getElementById('tab-'+t).style.display = t===name ? '' : 'none');
  if (name === 'salary') loadTeachers();
}

// ---------- 打卡数据 ----------
async function loadAttendance() {
  try {
    const r = await fetch(API + '/attendance/list?current=1&size=500', { headers: {'Authorization':'Bearer '+token} });
    const d = await r.json();
    const recs = d.data?.records || [];
    const waitRecs = recs.filter(a => a.auditStatus === 0);
    const tbody = document.getElementById('attendanceTable');
    if (!waitRecs.length) { tbody.innerHTML=''; document.getElementById('attendanceEmpty').style.display=''; return; }
    document.getElementById('attendanceEmpty').style.display='none';
    tbody.innerHTML = waitRecs.map(a => `
      <tr>
        <td>${a.teacherName || ('教师#'+a.teacherId)}</td>
        <td>${(a.actualStartTime||'').slice(0,16)}</td>
        <td>${a.durationMinutes||0} 分钟</td>
        <td>${a.studentCount||0}</td>
        <td>${a.leaveCount||0}</td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${a.studentNames||''}">${a.studentNames||'-'}</td>
        <td><span class="tag tag-wait">待审核</span></td>
        <td>
          <button class="btn-sm btn-green" onclick="auditAttendance(${a.id},1)">通过</button>
          <button class="btn-sm btn-red" onclick="auditAttendance(${a.id},2)">驳回</button>
        </td>
      </tr>
    `).join('');
  } catch(e) { toast('加载失败'); }
}

async function auditAttendance(id, status) {
  try {
    const r = await fetch(API + '/attendance/audit/' + id, {
      method: 'POST', headers: {'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({ action: status===1?'APPROVE':'REJECT', remark: status===1?'通过':'驳回' })
    });
    const d = await r.json();
    if (d.code === 200) { toast(status===1?'✓ 已通过':'✓ 已驳回'); loadAttendance(); }
    else toast(d.msg || '操作失败');
  } catch(e) { toast('网络错误'); }
}

// ---------- 教师管理 ----------
async function loadTeachers() {
  try {
    const r = await fetch(API + '/teacher/list', { headers: {'Authorization':'Bearer '+token} });
    const d = await r.json();
    const recs = Array.isArray(d.data) ? d.data : (d.data?.records || []);
    const tbody = document.getElementById('teacherTable');
    document.getElementById('statTeachers').textContent = recs.length;
    if (!recs.length) { tbody.innerHTML=''; document.getElementById('teacherEmpty').style.display=''; return; }
    document.getElementById('teacherEmpty').style.display='none';
    tbody.innerHTML = recs.map(t => `
      <tr><td>${t.employeeNo || '-'}</td><td>${t.name}</td><td>${t.level || '-'}</td>
      <td>${(t.createdAt||'').slice(0,10)}</td>
      <td><span class="tag ${t.status===1?'tag-ok':'tag-rej'}">${t.status===1?'正常':'停用'}</span></td></tr>
    `).join('');
  } catch(e) { toast('加载失败'); }
}

async function registerTeacher() {
  const name = document.getElementById('t_name').value.trim();
  const account = document.getElementById('t_account').value.trim();
  const password = document.getElementById('t_password').value;
  const level = document.getElementById('t_level').value;
  if (!name || !account) return toast('请填写姓名和账号');
  if (!password) return toast('请填写初始密码');
  try {
    const r = await fetch(API + '/teacher/register', {
      method: 'POST', headers: {'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({ name, account, password, level })
    });
    const d = await r.json();
    if (d.code === 200) {
      toast('✓ 注册成功！账号 ' + account + '，密码 ' + password);
      ['t_name','t_account'].forEach(id => document.getElementById(id).value='');
      loadTeachers();
    } else {
      toast(d.msg || '注册失败');
    }
  } catch(e) { toast('网络错误'); }
}

// ---------- 工资计算 ----------
function saveRule() {
  const rule = {
    baseRate: parseFloat(document.getElementById('baseRate').value) || 0,
    headThreshold: parseInt(document.getElementById('headThreshold').value) || 0,
    headPrice: parseFloat(document.getElementById('headPrice').value) || 0
  };
  localStorage.setItem('payRule', JSON.stringify(rule));
  toast('✓ 规则已保存');
}

async function calcSalary() {
  const rule = {
    baseRate: parseFloat(document.getElementById('baseRate').value) || 0,
    headThreshold: parseInt(document.getElementById('headThreshold').value) || 0,
    headPrice: parseFloat(document.getElementById('headPrice').value) || 0
  };
  localStorage.setItem('payRule', JSON.stringify(rule));
  const month = document.getElementById('calcMonth').value;
  if (!rule.baseRate) return toast('请填写基础课时费');
  if (!month) return toast('请选择月份');

  toast('计算中...');
  try {
    // 获取该月所有已通过的打卡
    const r = await fetch(API + '/attendance/list?current=1&size=1000&auditStatus=1', { headers: {'Authorization':'Bearer '+token} });
    const d = await r.json();
    const all = d.data?.records || [];
    const passRecs = all.filter(a => (a.actualStartTime||'').startsWith(month));

    // 按教师汇总
    const groups = {};
    passRecs.forEach(a => {
      const tid = a.teacherId;
      if (!groups[tid]) groups[tid] = { teacherName: a.teacherName || ('教师'+tid), minutes: 0, studentDays: [] };
      groups[tid].minutes += a.durationMinutes || 0;
      const headcount = Math.max(0, (a.studentCount||0) - (a.leaveCount||0));
      if (headcount > rule.headThreshold) {
        groups[tid].studentDays.push(headcount - rule.headThreshold);
      }
    });

    const rows = [];
    let total = 0;
    Object.values(groups).forEach(g => {
      const hours = g.minutes / 60;
      const basePay = +(rule.baseRate * hours).toFixed(2);
      const headPay = +(g.studentDays.reduce((a,b)=>a+b*rule.headPrice, 0)).toFixed(2);
      const subtotal = +(basePay + headPay).toFixed(2);
      rows.push({ name: g.teacherName, hours: hours.toFixed(1), basePay, headPay, subtotal });
      total += subtotal;
    });

    document.getElementById('statTotal').textContent = '¥' + total.toFixed(2);

    const list = document.getElementById('salaryList');
    if (!rows.length) { list.innerHTML=''; document.getElementById('salaryEmpty').style.display=''; return; }
    document.getElementById('salaryEmpty').style.display='none';
    list.innerHTML = rows.sort((a,b)=>b.subtotal-a.subtotal).map(r => `
      <div class="pay-row">
        <div>
          <div class="name">${r.name}</div>
          <div style="font-size:12px;color:#999;margin-top:4px;">${r.hours}h × ¥${rule.baseRate} = ¥${r.basePay} · 人头增量 ¥${r.headPay}</div>
        </div>
        <div class="amount">¥${r.subtotal.toFixed(2)}</div>
      </div>
    `).join('');
    toast('✓ 计算完成');
  } catch(e) { toast('网络错误'); }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
