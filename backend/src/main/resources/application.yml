server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: salary-backend
  datasource:
    url: jdbc:mysql://localhost:3306/school_salary?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT
jwt:
  secret: school-salary-admin-system-internal-use-only-2026
  expire-hours: 72

# 文件存储
app:
  upload-dir: ./uploads

# 默认管理员信息
init:
  default-admin-password: admin123

logging:
  level:
    com.school.salary: debug

# Swagger / OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Actuator 健康检查（Spring Boot 内置）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
